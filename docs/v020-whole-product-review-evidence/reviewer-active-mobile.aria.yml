      - article:
        - text: Customer care
        - heading "Warm opening" [level=3]
        - text: Unanswered
        - paragraph: Did the agent greet the customer and offer help at the start of the conversation?
        - text: Human answer
        - 'combobox "Human answer: Warm opening"':
          - option "Select an answer" [selected]
          - option "Yes"
          - option "No"
        - paragraph: Human credit —
        - text: Question note
        - 'textbox "Question note: Warm opening" [disabled]'
        - text: AI RESULT
        - strong: "Yes"
        - paragraph: Credit 100% · Yes probability 95%
        - text: Selected-answer confidence 95%
      - article:
        - text: Customer care
        - heading "Understanding the issue" [level=3]
        - text: Unanswered
        - paragraph: How effectively did the agent establish and acknowledge the customer’s actual issue?
        - text: Human answer
        - 'combobox "Human answer: Understanding the issue"':
          - option "Select an answer" [selected]
          - option "Poor"
          - option "Needs improvement"
          - option "Good"
          - option "Excellent"
        - paragraph: Human credit —
        - text: Question note
        - 'textbox "Question note: Understanding the issue" [disabled]'
        - text: AI RESULT
        - strong: 1.00 / 3
        - paragraph: Credit 33% · Confidence 75%
      - article:
        - text: Customer care
        - heading "Resolution" [level=3]
        - text: Unanswered
        - paragraph: What is the best description of the issue outcome by the end of the conversation?
        - text: Human answer
        - 'combobox "Human answer: Resolution"':
          - option "Select an answer" [selected]
          - option "Fully resolved"
          - option "Partially resolved"
          - option "Unresolved"
          - option "Not applicable"
        - paragraph: Human credit —
        - text: Question note
        - 'textbox "Question note: Resolution" [disabled]'
        - text: AI RESULT
        - strong: Fully resolved
        - paragraph: Credit 100% · Confidence 85%
