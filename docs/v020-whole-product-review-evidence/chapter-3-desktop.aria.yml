  - heading "Broader coverage becomes attractive" [level=2]
  - paragraph: Structured, batched questions and Jev’s very low model input cost make broader evaluation economically attractive.
  - paragraph: In this example, a policy selects 24 of 48 eligible conversations (50%) from one customer-service queue. Each uses the same published form. Conditional questions need another request only when they apply.
  - paragraph: The calculator on Welcome lets you change volume, selection and request assumptions. Model cost is one component of a pilot’s operating cost.
